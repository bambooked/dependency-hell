name: Grade environment repair

on:
  pull_request:

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject forbidden file changes
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          while IFS= read -r file; do
            case "$file" in
              pyproject.toml|.python-version|uv.lock) ;;
              *) echo "File not allowed to change: $file" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "origin/$BASE_REF"...HEAD)

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync the submitted environment
        run: uv sync --no-dev

      - name: Assert exact program output
        shell: bash
        run: |
          set -euo pipefail
          output="$(uv run --no-sync python main.py)"
          if [ "$output" != "complete" ]; then
            printf 'Expected exactly "complete", got: %q\n' "$output" >&2
            exit 1
          fi
          echo "PASS: complete"
